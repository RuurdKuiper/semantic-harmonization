preferred_name: Erythema Multiforme
definition: >
  Acute, self-limited inflammatory skin disorder characterized by typical or
  atypical target lesions with predominant acral distribution. May occur with
  or without mucosal involvement, usually affecting the extremities, and is
  often associated with infections (especially herpes simplex virus) or
  medications.
inclusion_criteria:
  - Typical or atypical target lesions
  - Predominant acral (extremity) distribution
  - May include mucosal involvement
narrow_definition: >
  Erythema multiforme (major or minor), including bullous forms, presenting
  with the characteristic target-lesion morphology and acral distribution.
exclusion_criteria:
  - Stevens-Johnson Syndrome (SJS)
  - Toxic Epidermal Necrolysis (TEN)
  - Drug eruptions NOS
  - Autoimmune blistering disorders
  - Fixed drug eruption
  - Cutaneous vasculitis
  - Erythematous rash NOS
  - History of erythema multiforme
  - Screening, follow-up, or rule-out diagnoses
  - Target lesions without definitive diagnosis
  - Mucocutaneous hypersensitivity reactions
  - Unspecified erythematous eruptions
  - Conditions strongly related to EM but lacking diagnostic certainty
narrow_decision_rules:
  - Code explicitly refers to erythema multiforme (major or minor), bullous erythema multiforme,
    or a named synonym of erythema multiforme
  - Anchor code family: ICD10CM L51 (Erythema multiforme)
exclude_decision_rules:
  - Code refers to Stevens-Johnson Syndrome or Toxic Epidermal Necrolysis
  - Code refers to drug eruptions, fixed drug eruption, or cutaneous vasculitis without target lesions
  - Code refers to unspecified/erythematous rash, history of, or diagnoses lacking certainty
synonyms:
  - Erythema multiforme major
  - Erythema multiforme minor
  - Bullous erythema multiforme
  - Dermatostomatitis, Erythema Multiforme Type
  - Erythema Multiforme Bullosum
  - Erythema Polymorphe
  - Febrile Mucocutaneous Syndrome
  - Herpes Iris
  - Polymorphic Erythema
anatomical_location: Skin (predominantly acral/extremities), with possible mucosal involvement
population_restrictions: ""
temporal_characteristics: Acute, self-limited onset
etiology: Often associated with infections (especially herpes simplex virus) or medications
morphology: Typical or atypical target lesions
diagnostic_certainty: Clinical diagnosis based on characteristic target-lesion morphology and distribution
administrative_context: "Candidate anchor code: ICD10CM L51 --> Erythema multiforme"
