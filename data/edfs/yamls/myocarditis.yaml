preferred_name: Acute Myocarditis
definition: >
  Acute Myocarditis is an acute inflammatory disease of the myocardium
  characterized by myocardial injury in the absence of ischemic heart disease
  and confirmed through clinical presentation, biomarkers, imaging findings,
  histopathology, or combinations thereof.
inclusion_criteria:
  - Clinical presentation, biomarker, imaging, or histopathological evidence of myocardial injury
  - Absence of ischemic heart disease as the explanation for injury
narrow_definition: >
  Acute inflammatory disease of the myocardium, including viral, autoimmune,
  fulminant, giant cell, lymphocytic, eosinophilic, vaccine-associated, and
  drug-associated presentations, and myopericarditis.
exclusion_criteria:
  - Myocardial infarction
  - Chronic myocarditis
  - Isolated pericarditis
  - Isolated endocarditis
  - History of myocarditis
  - Suspected myocarditis (not confirmed)
  - Myocardial injury NOS (not otherwise specified as inflammatory)
narrow_decision_rules:
  - Code explicitly refers to acute myocarditis, myopericarditis, or a named acute myocarditis subtype
    (viral, autoimmune, fulminant, giant cell, lymphocytic, eosinophilic, vaccine-associated, drug-associated)
  - Anchor code family: ICD10CM I40 (Acute myocarditis)
exclude_decision_rules:
  - Code refers to myocardial infarction or other ischemic heart disease
  - Code refers to chronic myocarditis
  - Code refers exclusively to pericarditis or endocarditis without myocardial involvement
  - Code refers to history of, suspected, or unspecified myocardial injury without confirmed inflammation
synonyms:
  - Myocarditis UNS (unspecific)
  - Myopericarditis
  - Inflammation of heart muscle
  - Myocardial inflammation
  - Viral myocarditis
  - Autoimmune myocarditis
  - Fulminant myocarditis
  - Giant cell myocarditis
  - Lymphocytic myocarditis
  - Eosinophilic myocarditis
  - Vaccine-associated myocarditis
  - Drug associated myocarditis
  - Acute inflammatory cardiomyopathy
anatomical_location: Myocardium (heart muscle), may extend to pericardium (myopericarditis)
population_restrictions: ""
temporal_characteristics: Acute onset; may follow viral infection, vaccination, or drug exposure
etiology: Viral, autoimmune, drug/toxin-induced, vaccine-associated, or idiopathic
morphology: Lymphocytic, eosinophilic, giant cell, or fulminant inflammatory infiltrate
diagnostic_certainty: Confirmed via clinical presentation, biomarkers, imaging, or histopathology
administrative_context: "Candidate anchor code: ICD10CM I40 --> Acute myocarditis"
