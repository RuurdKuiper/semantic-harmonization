phenotype: myocarditis

verbose: true

paths:
  edf_dir: data/raw/edf
  codes_path: data/raw/codes/codes.csv
  gold_dir: data/gold
  processed_dir: data/processed
  results_dir: data/processed/results
  aesi_datasets:
    myocarditis: "data/raw/Acute Myocarditis/C_MYOCARD_AESI_filtered.csv"
    erythema_multiforme: "data/raw/Erythema Multiforme/Sk_ERYTHMULTI_AESI.csv"
    guillain_barre: "data/raw/Guillain barre syndrome (GBS)/N_GBS_AESI_filtered.csv"
  code_systems:
    ICD10CM: "data/codes/icd10.xlsx"

retrieval:
  lexical_weight: 0.5
  embedding_weight: 0.5
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 5
  vocabularies:
    - ICD10CM

llm:
  provider: auto
  anthropic_model: claude-opus-4-8
  openai_model: gpt-5-mini
  rank_effort: low
  classify_effort: low
  max_retries: 3

uncertainty:
  confidence_threshold: 0.7
  possible_requires_review: true

evaluation:
  narrow_only_as_positive: true
  compare_vocabularies:
    - ICD10CM
