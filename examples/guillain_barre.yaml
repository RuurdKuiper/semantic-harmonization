preferred_name: Guillain-Barre syndrome
definition: >
  Acute immune-mediated polyneuropathy characterized by rapidly progressive
  weakness.
inclusion_criteria:
  - Rapidly progressive weakness
  - Acute immune-mediated polyneuropathy
narrow_definition: >
  Guillain-Barre syndrome (GBS) and its recognized clinical variants, including
  AIDP, Miller Fisher syndrome, AMSAN, and AMAN.
exclusion_criteria:
  - Chronic inflammatory demyelinating polyneuropathy
  - History of Guillain-Barre syndrome
  - Sequelae of Guillain-Barre syndrome
narrow_decision_rules:
  - Code explicitly refers to Guillain-Barre syndrome or one of its named variants
    (AIDP, Miller Fisher syndrome, AMSAN, AMAN, facial diplegia with paresthesia)
  - Anchor code family: ICD10CM G61.0 (Guillain-Barre syndrome)
exclude_decision_rules:
  - Code refers to chronic inflammatory demyelinating polyneuropathy (chronic course)
  - Code refers to history of or sequelae of Guillain-Barre syndrome
synonyms:
  - Guillain-Barre syndrome (GBS)
  - Acute inflammatory demyelinating polyneuropathy (AIDP)
  - Miller Fisher syndrome
  - Acute motor sensory axonal neuropathy (AMSAN)
  - Acute motor axonal neuropathy (AMAN)
  - Facial diplegia with paresthesia
anatomical_location: Peripheral nerves, nerve roots, cranial nerves (Miller Fisher variant)
population_restrictions: ""
temporal_characteristics: Acute onset, rapidly progressive
etiology: Immune-mediated, often post-infectious or post-vaccination
morphology: Demyelination (AIDP) or axonal degeneration (AMAN/AMSAN) of peripheral nerves
diagnostic_certainty: Clinical diagnosis of rapidly progressive weakness with supportive electrodiagnostic/CSF findings
administrative_context: "Candidate anchor code: ICD10CM G61.0 --> Guillain-Barre syndrome"
