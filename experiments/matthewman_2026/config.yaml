retrieval:
  lexical_weight: 0.5
  embedding_weight: 0.5
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  # Unlike the paper's agent, our pipeline performs one fixed retrieval rather
  # than multiple top-100 tool calls. Use a pool large enough to make complete
  # retrieval of the 214-code wrist-fracture target theoretically possible.
  top_k: 500
  batch_size: 10

design:
  epochs: 3
  subsets:
    - full
    - read
  models:
    - google:gemini-3-pro-preview
    - google:gemini-3-flash-preview
    - openai:gpt-5.2
    - anthropic:claude-sonnet-4-6

minimal_instruction: Include codes indicating that the person currently has the condition.
