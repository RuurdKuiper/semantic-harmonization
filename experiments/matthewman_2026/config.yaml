retrieval:
  lexical_weight: 0.1
  embedding_weight: 0.9
  embedding_provider: openai
  embedding_model: text-embedding-3-large
  embedding_dimensions: 3072
  embedding_batch_size: 512
  # Null means score and order the complete vocabulary. --top-k remains
  # available as an explicit capacity-limited ablation.
  top_k: null

classification:
  provider: jev
  model: jev-latest
  batch_size: 20
  sparse_narrow_threshold: 0
  consecutive_sparse_batches: 10
  minimum_batches: 10

review:
  provider: openai
  model: gpt-6-luna
  confidence_threshold: 0.7
  max_candidates: 200
  batch_size: 10
  reasoning_effort: medium

design:
  epochs: 1
  subsets:
    - full
    - read

# This policy is used only by the Jev/GPT classification stages. Retrieval
# remains a single phenotype-name query, matching the deliberately minimal
# retrieval input. The rules operationalize categories present in the paper's
# reference codelists without exposing phenotype-specific codes or terms.
classification_policy:
  definition: Include codes indicating that the person currently has the condition.
  narrow_decision_rules:
    - Include a code when its recorded term would ordinarily assert the target condition, even when it does not repeat the preferred phenotype name verbatim.
    - Include synonyms, alternative spellings, abbreviations, eponyms, historical names, named subtypes, and anatomically qualified forms of the condition.
    - Include a manifestation or complication when the term explicitly attributes it to the target condition.
    - Include a combined anatomical concept when it explicitly includes the target site together with an adjacent site and still asserts the target condition.
    - Include a sequela or disorder explicitly described as due to or following the target condition.
    - Include a therapeutic procedure only when the term itself explicitly states that the procedure treats or fixes the target condition.
  exclude_decision_rules:
    - Exclude family history, risk, screening, monitoring, counselling, referral, administrative, negated, ruled-out, and merely suspected concepts that do not assert the condition.
    - Exclude symptoms, manifestations, complications, diagnostic procedures, treatments, and adjacent anatomical concepts that are not explicitly tied to the target condition.
    - Exclude terminology hierarchy headings and code ranges rather than codable clinical concepts.
